name: build-iii-engine

on:
  push:
    branches:
      - main
    paths:
      - images/agentmemory-mcp/Dockerfile.iii-engine
      - images/agentmemory-mcp/iii-config.yaml
      - .github/workflows/build-iii-engine.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -E '^ARG III_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/agentmemory-mcp/Dockerfile.iii-engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.version }}

      - name: Smoke test
        run: |
          docker pull ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.version }}
          docker run --rm ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.version }} --version
