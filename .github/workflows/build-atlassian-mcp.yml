name: Build and publish Atlassian MCP image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and publish Atlassian MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
    with:
      image_name: atlassian-mcp
      context: ./images/atlassian-mcp
      dockerfile: ./images/atlassian-mcp/Dockerfile
      config: images/atlassian-mcp/image.yaml
      version_arg: ATLASSIAN_VERSION
      platforms: linux/amd64
      smoke_command: --help
      scan: true
      auto_increment_revision: true
      publish: ${{ github.event_name != 'pull_request' }}
