name: Build and publish Atlassian MCP image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images/atlassian-mcp/**
      - .github/workflows/build-atlassian-mcp.yml

permissions:
  contents: write
  packages: write
  # The shared workflow proposes the revision bump as a PR, because
  # the base branch rejects direct pushes. A reusable workflow runs
  # with the calling job's token scope, so the grant must be here.
  pull-requests: write

jobs:
  build:
    name: Build and publish Atlassian MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: atlassian-mcp
      context: ./images/atlassian-mcp
      dockerfile: ./images/atlassian-mcp/Dockerfile
      config: images/atlassian-mcp/image.yaml
      version_arg: ATLASSIAN_VERSION
      platforms: linux/amd64
      smoke_command: --help
      scan: true
      auto_increment_revision: true
      publish: ${{ github.event_name != 'pull_request' }}
