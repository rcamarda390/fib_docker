name: Build and publish Atlassian MCP image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images/atlassian-mcp/**
      - .github/workflows/build-atlassian-mcp.yml

permissions:
  contents: write
  packages: write
  # Required by the reusable workflow contract. Atlassian's run-number mode
  # does not exercise the revision-PR step, but called workflows cannot request
  # a broader token scope than their caller grants.
  pull-requests: write

jobs:
  build:
    name: Build and publish Atlassian MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: atlassian-mcp
      context: ./images/atlassian-mcp
      dockerfile: ./images/atlassian-mcp/Dockerfile
      config: images/atlassian-mcp/image.yaml
      version_arg: ATLASSIAN_VERSION
      platforms: linux/amd64
      smoke_command: --help
      scan: true
      # Publish a fresh immutable revision in this same run. The shared workflow
      # combines image.yaml's revision floor with this workflow's monotonic run
      # number, so no follow-up version-bump PR is needed.
      revision_from_run_number: true
      publish: ${{ github.event_name != 'pull_request' }}
