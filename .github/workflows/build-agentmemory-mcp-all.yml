name: build-agentmemory-mcp-all

on:
  workflow_dispatch:
    inputs:
      build_iii_engine:
        description: Build iii-engine image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      build_agentmemory:
        description: Build agentmemory image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      agentmemory_version:
        description: "agentmemory version to build (leave blank to auto-bump patch from npm)"
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-iii-engine:
    if: ${{ inputs.build_iii_engine == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -E '^ARG III_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d'=' -f2)
          IMAGE_VERSION=$(grep -E '^ARG III_IMAGE_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d'=' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION}-airgap-${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.iii-engine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            III_VERSION=${{ steps.meta.outputs.version }}
            III_IMAGE_VERSION=${{ steps.meta.outputs.image_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.image_tag }}

      - name: Smoke test iii-engine
        run: |
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.image_tag }}
          docker run --rm docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.image_tag }} --version

  build-agentmemory:
    if: ${{ inputs.build_agentmemory == 'true' }}
    needs: build-iii-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ -z "${{ inputs.agentmemory_version }}" ]; then
            CURRENT=$(npm view @agentmemory/agentmemory version 2>/dev/null || echo "0.9.26")
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            VERSION="${{ inputs.agentmemory_version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.agentmemory
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AGENTMEMORY_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:latest

      - name: Smoke test
        run: |
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.version }}
          docker run --rm \
            -e III_ENGINE_URL=ws://localhost:49134 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.version }} \
            node -e "console.log('agentmemory image OK')"
