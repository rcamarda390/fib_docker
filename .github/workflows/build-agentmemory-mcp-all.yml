name: build-agentmemory-mcp-all

on:
  workflow_dispatch:
    inputs:
      build_iii_engine:
        description: Build iii-engine image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      build_agentmemory:
        description: Build agentmemory image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      agentmemory_version:
        description: agentmemory package version to publish
        required: true
        default: '0.9.26'

permissions:
  contents: read
  packages: write

jobs:
  build-iii-engine:
    if: ${{ inputs.build_iii_engine == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          VERSION=$(grep "ARG III_VERSION=" images/agentmemory-mcp/Dockerfile.iii-engine | cut -d'=' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.iii-engine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            III_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.version }}

  build-agentmemory:
    if: ${{ inputs.build_agentmemory == 'true' }}
    needs: build-iii-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.agentmemory_version }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.agentmemory
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AGENTMEMORY_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:latest

      - name: Smoke test
        run: |
          docker pull ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ steps.meta.outputs.version }}
          docker run --rm \
            -e III_ENGINE_URL=ws://localhost:49134 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ steps.meta.outputs.version }} \
            node -e "console.log('agentmemory image OK')"
