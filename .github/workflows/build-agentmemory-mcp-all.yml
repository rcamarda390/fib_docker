name: build-agentmemory-mcp-all

on:
  workflow_dispatch:
    inputs:
      build_iii_engine:
        description: Build iii-engine image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      iii_version:
        description: iii release version to build (leave blank to reuse the tracked version)
        required: false
        default: ''
      iii_image_version:
        description: Optional iii image revision override (leave blank to auto-bump)
        required: false
        default: ''
      build_agentmemory:
        description: Build agentmemory image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      agentmemory_version:
        description: agentmemory package version to publish (leave blank to reuse the tracked version)
        required: false
        default: ''
      agentmemory_image_version:
        description: Optional agentmemory image revision override (leave blank to auto-bump)
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-all:
    if: ${{ inputs.build_iii_engine == 'true' || inputs.build_agentmemory == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        env:
          BUILD_III_ENGINE: ${{ inputs.build_iii_engine }}
          INPUT_III_VERSION: ${{ github.event.inputs.iii_version || '' }}
          INPUT_III_IMAGE_VERSION: ${{ github.event.inputs.iii_image_version || '' }}
          BUILD_AGENTMEMORY: ${{ inputs.build_agentmemory }}
          INPUT_AGENTMEMORY_VERSION: ${{ github.event.inputs.agentmemory_version || '' }}
          INPUT_AGENTMEMORY_IMAGE_VERSION: ${{ github.event.inputs.agentmemory_image_version || '' }}
        run: |
          next_image_version() {
            case "$1" in
              v[0-9]*) echo "v$(( ${1#v} + 1 ))" ;;
              '') echo 'v1' ;;
              *)
                echo "Unsupported image version format: $1" >&2
                exit 1
                ;;
            esac
          }

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_III_ENGINE" = 'true' ]; then
            CURRENT_III_VERSION=$(grep -E '^ARG III_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d'=' -f2)
            CURRENT_III_IMAGE_VERSION=$(grep -E '^ARG III_IMAGE_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d'=' -f2)
            III_VERSION="${INPUT_III_VERSION:-$CURRENT_III_VERSION}"

            if [ -n "$INPUT_III_IMAGE_VERSION" ]; then
              III_IMAGE_VERSION="$INPUT_III_IMAGE_VERSION"
            elif [ "$III_VERSION" = "$CURRENT_III_VERSION" ]; then
              III_IMAGE_VERSION=$(next_image_version "$CURRENT_III_IMAGE_VERSION")
            else
              III_IMAGE_VERSION='v1'
            fi

            III_IMAGE_TAG="${III_VERSION}-airgap-${III_IMAGE_VERSION}"

            sed -i "s/^ARG III_VERSION=.*/ARG III_VERSION=${III_VERSION}/" images/agentmemory-mcp/Dockerfile.iii-engine
            sed -i "s/^ARG III_IMAGE_VERSION=.*/ARG III_IMAGE_VERSION=${III_IMAGE_VERSION}/" images/agentmemory-mcp/Dockerfile.iii-engine
            sed -i -E "s#(iii-engine:)[^[:space:]]+#\\1${III_IMAGE_TAG}#" images/agentmemory-mcp/docker-compose.yml

            echo "iii_version=${III_VERSION}" >> "$GITHUB_OUTPUT"
            echo "iii_image_version=${III_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "iii_image_tag=${III_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi

          if [ "$BUILD_AGENTMEMORY" = 'true' ]; then
            CURRENT_AGENTMEMORY_VERSION=$(grep -m1 -E '^ARG AGENTMEMORY_VERSION=' images/agentmemory-mcp/Dockerfile.agentmemory | cut -d'=' -f2)
            CURRENT_AGENTMEMORY_IMAGE_VERSION=$(grep -m1 -E '^ARG AGENTMEMORY_IMAGE_VERSION=' images/agentmemory-mcp/Dockerfile.agentmemory | cut -d'=' -f2)
            AGENTMEMORY_VERSION="${INPUT_AGENTMEMORY_VERSION:-$CURRENT_AGENTMEMORY_VERSION}"

            if [ -n "$INPUT_AGENTMEMORY_IMAGE_VERSION" ]; then
              AGENTMEMORY_IMAGE_VERSION="$INPUT_AGENTMEMORY_IMAGE_VERSION"
            elif [ "$AGENTMEMORY_VERSION" = "$CURRENT_AGENTMEMORY_VERSION" ]; then
              AGENTMEMORY_IMAGE_VERSION=$(next_image_version "$CURRENT_AGENTMEMORY_IMAGE_VERSION")
            else
              AGENTMEMORY_IMAGE_VERSION='v1'
            fi

            AGENTMEMORY_IMAGE_TAG="${AGENTMEMORY_VERSION}-build-${AGENTMEMORY_IMAGE_VERSION}"

            sed -i "s/^ARG AGENTMEMORY_VERSION=.*/ARG AGENTMEMORY_VERSION=${AGENTMEMORY_VERSION}/" images/agentmemory-mcp/Dockerfile.agentmemory
            sed -i "s/^ARG AGENTMEMORY_IMAGE_VERSION=.*/ARG AGENTMEMORY_IMAGE_VERSION=${AGENTMEMORY_IMAGE_VERSION}/" images/agentmemory-mcp/Dockerfile.agentmemory
            sed -i -E "s#(agentmemory:)[^[:space:]]+#\\1${AGENTMEMORY_IMAGE_TAG}#" images/agentmemory-mcp/docker-compose.yml

            echo "agentmemory_version=${AGENTMEMORY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "agentmemory_image_version=${AGENTMEMORY_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "agentmemory_image_tag=${AGENTMEMORY_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist tracked versions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/agentmemory-mcp/Dockerfile.iii-engine images/agentmemory-mcp/Dockerfile.agentmemory images/agentmemory-mcp/docker-compose.yml
          if git diff --cached --quiet; then
            echo 'No tracked version changes to commit.'
            exit 0
          fi
          git commit -m 'chore: track latest image revisions'
          git push

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: ${{ inputs.build_iii_engine == 'true' }}
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.iii-engine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            III_VERSION=${{ steps.meta.outputs.iii_version }}
            III_IMAGE_VERSION=${{ steps.meta.outputs.iii_image_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }}

      - name: Smoke test iii-engine
        if: ${{ inputs.build_iii_engine == 'true' }}
        run: |
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }}
          docker run --rm docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }} --version

      - uses: docker/build-push-action@v6
        if: ${{ inputs.build_agentmemory == 'true' }}
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.agentmemory
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            AGENTMEMORY_VERSION=${{ steps.meta.outputs.agentmemory_version }}
            AGENTMEMORY_IMAGE_VERSION=${{ steps.meta.outputs.agentmemory_image_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.agentmemory_image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.agentmemory_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:latest

      - name: Smoke test agentmemory
        if: ${{ inputs.build_agentmemory == 'true' }}
        run: |
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.agentmemory_image_tag }}
          docker run --rm \
            -e III_ENGINE_URL=ws://localhost:49134 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.agentmemory_image_tag }} \
            node -e "console.log('agentmemory image OK')"

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_iii_engine }}" = 'true' ]; then
            echo "✅ iii-engine:${{ steps.meta.outputs.iii_image_tag }} → docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.build_agentmemory }}" = 'true' ]; then
            echo "✅ agentmemory:${{ steps.meta.outputs.agentmemory_image_tag }} → docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.agentmemory_image_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
