name: build-iii-engine

on:
  push:
    branches: [main]
    paths:
      - images/iii-engine/**
      - images/agentmemory-mcp/Dockerfile.iii-engine
      - images/agentmemory-mcp/iii-config.yaml
      - .github/workflows/build-iii-engine.yml
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: iii-engine
      context: ./images/agentmemory-mcp
      dockerfile: ./images/agentmemory-mcp/Dockerfile.iii-engine
      config: images/iii-engine/image.yaml
      version_arg: III_VERSION

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/iii-engine:${{ needs.build.outputs.image_tag }}
        run: |
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --version
