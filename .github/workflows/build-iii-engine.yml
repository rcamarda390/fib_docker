name: build-iii-engine

on:
  push:
    branches: [main]
    paths:
      - images/iii-engine/**
      - images/agentmemory-mcp/Dockerfile.iii-engine
      - images/agentmemory-mcp/iii-config.yaml
      - .github/workflows/build-iii-engine.yml
      - .github/workflows/build-image.yml
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image_name: iii-engine
      context: ./images/agentmemory-mcp
      dockerfile: ./images/agentmemory-mcp/Dockerfile.iii-engine
      config: images/iii-engine/image.yaml
      version_arg: III_VERSION
      smoke_command: --version
