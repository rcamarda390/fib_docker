name: build-iii-engine

on:
  push:
    branches:
      - main
    paths:
      - 'images/agentmemory-mcp/Dockerfile.iii-engine'
      - 'images/agentmemory-mcp/iii-config.yaml'
      - '.github/workflows/build-iii-engine.yml'
  workflow_dispatch:
    inputs:
      iii_version:
        description: iii release version to build (leave blank to reuse the tracked version)
        required: false
        default: ''
      iii_image_version:
        description: Optional iii image revision override (leave blank to auto-bump)
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - id: meta
        shell: bash
        env:
          INPUT_III_VERSION: ${{ github.event.inputs.iii_version || '' }}
          INPUT_III_IMAGE_VERSION: ${{ github.event.inputs.iii_image_version || '' }}
        run: |
          next_image_version() {
            case "$1" in
              v[0-9]*) echo "v$(( ${1#v} + 1 ))" ;;
              '') echo 'v1' ;;
              *)
                echo "Unsupported image version format: $1" >&2
                exit 1
                ;;
            esac
          }

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          CURRENT_VERSION=$(grep -E '^ARG III_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d'=' -f2)
          CURRENT_IMAGE_VERSION=$(grep -E '^ARG III_IMAGE_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d'=' -f2)
          VERSION="${INPUT_III_VERSION:-$CURRENT_VERSION}"

          if [ -n "$INPUT_III_IMAGE_VERSION" ]; then
            IMAGE_VERSION="$INPUT_III_IMAGE_VERSION"
          elif [ "$VERSION" = "$CURRENT_VERSION" ]; then
            IMAGE_VERSION=$(next_image_version "$CURRENT_IMAGE_VERSION")
          else
            IMAGE_VERSION='v1'
          fi

          IMAGE_TAG="${VERSION}-${IMAGE_VERSION}"

          sed -i "s/^ARG III_VERSION=.*/ARG III_VERSION=${VERSION}/" images/agentmemory-mcp/Dockerfile.iii-engine
          sed -i "s/^ARG III_IMAGE_VERSION=.*/ARG III_IMAGE_VERSION=${IMAGE_VERSION}/" images/agentmemory-mcp/Dockerfile.iii-engine
          sed -i -E "/^\s*image:.*\/iii-engine:/ s#(iii-engine:)[^[:space:]]+#\\1${IMAGE_TAG}#" images/agentmemory-mcp/docker-compose.yml

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Persist tracked versions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/agentmemory-mcp/Dockerfile.iii-engine images/agentmemory-mcp/docker-compose.yml
          if git diff --cached --quiet; then
            echo 'No tracked version changes to commit.'
            exit 0
          fi
          git commit -m "chore: bump iii-engine image to ${{ steps.meta.outputs.image_tag }}"
          git push

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.iii-engine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            III_VERSION=${{ steps.meta.outputs.version }}
            III_IMAGE_VERSION=${{ steps.meta.outputs.image_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.image_tag }}

      - name: Smoke test
        run: |
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.image_tag }}
          docker run --rm docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.image_tag }} --version

      - name: Summary
        run: |
          echo "## Build complete" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iii-engine:${{ steps.meta.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**iii version:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**image version:** \`${{ steps.meta.outputs.image_version }}\`" >> $GITHUB_STEP_SUMMARY
