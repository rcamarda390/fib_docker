name: Build and publish iii-engine MCP image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-iii-engine-image:
    name: Build and publish iii-engine MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
    with:
      image_name: iii-engine
      context: ./images/agentmemory-mcp
      dockerfile: ./images/agentmemory-mcp/Dockerfile.iii-engine
      config: images/iii-engine/image.yaml
      version_arg: III_VERSION
      revision_arg: III_IMAGE_VERSION
      smoke_command: --version
      auto_increment_revision: true
      publish: ${{ github.event_name != 'pull_request' }}
