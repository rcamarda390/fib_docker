name: Build and publish iii-engine MCP image

on:
  push:
    branches: [main]
    paths:
      - images/iii-engine/**
      - images/agentmemory-mcp/Dockerfile.iii-engine
      - images/agentmemory-mcp/iii-config.yaml
      - .github/workflows/build-iii-engine.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - images/iii-engine/**
      - images/agentmemory-mcp/Dockerfile.iii-engine
      - images/agentmemory-mcp/iii-config.yaml
      - .github/workflows/build-iii-engine.yml
      - .github/workflows/build-image.yml
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-iii-engine-image:
    name: Build and publish iii-engine MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
    with:
      image_name: iii-engine
      context: ./images/agentmemory-mcp
      dockerfile: ./images/agentmemory-mcp/Dockerfile.iii-engine
      config: images/iii-engine/image.yaml
      version_arg: III_VERSION
      smoke_command: --version
      auto_increment_revision: true
      publish: ${{ github.event_name != 'pull_request' }}
