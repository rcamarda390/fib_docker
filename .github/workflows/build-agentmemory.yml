name: build-agentmemory

on:
  push:
    branches: [main]
    paths:
      - images/agentmemory/**
      - images/agentmemory-mcp/**
      - .github/workflows/build-agentmemory.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - images/agentmemory/**
      - images/agentmemory-mcp/**
      - .github/workflows/build-agentmemory.yml
      - .github/workflows/build-image.yml
  schedule:
    - cron: "9 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image_name: agentmemory
      context: ./images/agentmemory-mcp
      dockerfile: ./images/agentmemory-mcp/Dockerfile.agentmemory
      config: images/agentmemory/image.yaml
      version_arg: AGENTMEMORY_VERSION
      smoke_env: >-
        -e III_ENGINE_URL=ws://localhost:49134
        -e TRANSFORMERS_OFFLINE=1
        -e HF_HUB_OFFLINE=1
      smoke_command: 'node,-e,console.log("agentmemory image OK")'
      publish: ${{ github.event_name != 'pull_request' }}
