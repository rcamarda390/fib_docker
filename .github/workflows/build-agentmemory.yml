name: build-agentmemory

on:
  workflow_dispatch:
    inputs:
      version:
        description: agentmemory package version to publish
        required: true
        default: 0.9.26

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.agentmemory
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            AGENTMEMORY_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:latest

      - name: Smoke test
        run: |
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.version }}
          docker run --rm \
            -e III_ENGINE_URL=ws://localhost:49134 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agentmemory:${{ steps.meta.outputs.version }} \
            node -e "console.log('agentmemory image OK')"
