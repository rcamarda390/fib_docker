name: build-agentmemory

on:
  push:
    branches: [main]
    paths:
      - images/agentmemory/**
      - images/agentmemory-mcp/**
      - .github/workflows/build-agentmemory.yml
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: agentmemory
      context: ./images/agentmemory-mcp
      dockerfile: ./images/agentmemory-mcp/Dockerfile.agentmemory
      config: images/agentmemory/image.yaml
      version_arg: AGENTMEMORY_VERSION

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/agentmemory:${{ needs.build.outputs.image_tag }}
        run: |
          docker pull "$IMAGE"
          docker run --rm \
            -e III_ENGINE_URL=ws://localhost:49134 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            "$IMAGE" node -e "console.log('agentmemory image OK')"
