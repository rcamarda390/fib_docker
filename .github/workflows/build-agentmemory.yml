name: Build and publish agentmemory MCP image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-agentmemory-image:
    name: Build and publish agentmemory MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
    with:
      image_name: agentmemory
      context: ./images/agentmemory-mcp
      dockerfile: ./images/agentmemory-mcp/Dockerfile.agentmemory
      config: images/agentmemory/image.yaml
      version_arg: AGENTMEMORY_VERSION
      smoke_env: >-
        -e III_ENGINE_URL=ws://localhost:49134
        -e TRANSFORMERS_OFFLINE=1
        -e HF_HUB_OFFLINE=1
      smoke_command: 'node,-e,console.log("agentmemory image OK")'
      scan: true
      auto_increment_revision: true
      publish: ${{ github.event_name != 'pull_request' }}
