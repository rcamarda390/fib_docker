name: Build and publish Headroom MCP image

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: >-
          Which Dockerfile to build. Dockerfile.cline-bedrock (the default)
          applies the downstream Bedrock carry on top of the base image pinned
          in its HEADROOM_BASE_IMAGE. Dockerfile builds that base image from
          upstream source, and has to be run once after every upstream_version
          bump -- the carry cannot build until the base tag it pins exists.
        type: choice
        default: Dockerfile.cline-bedrock
        options:
          - Dockerfile.cline-bedrock
          - Dockerfile
  push:
    branches: [main, 'claude/**']
    paths: ['images/headroom-mcp/**']


permissions:
  contents: write
  packages: write
  # The shared workflow proposes the revision bump as a PR, because
  # the base branch rejects direct pushes. A reusable workflow runs
  # with the calling job's token scope, so the grant must be here.
  pull-requests: write

jobs:
  detect-version-change:
    name: Detect if upstream_version changed
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if git show HEAD:images/headroom-mcp/image.yaml | grep -q "^upstream_version:"; then
            OLD_VERSION=$(git show HEAD~1:images/headroom-mcp/image.yaml 2>/dev/null | grep "^upstream_version:" | awk '{print $2}' || echo "")
            NEW_VERSION=$(git show HEAD:images/headroom-mcp/image.yaml | grep "^upstream_version:" | awk '{print $2}')
            if [ "$OLD_VERSION" != "$NEW_VERSION" ] && [ -n "$OLD_VERSION" ]; then
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "Version changed from $OLD_VERSION to $NEW_VERSION"
            else
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  build-base:
    name: Build base Dockerfile (upstream)
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch' && inputs.dockerfile == 'Dockerfile'
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: headroom-mcp
      context: ./images/headroom-mcp
      dockerfile: ./images/headroom-mcp/Dockerfile
      config: images/headroom-mcp/image.yaml
      version_arg: HEADROOM_VERSION
      platforms: linux/amd64
      smoke_command: __smoke
      smoke_timeout: 120
      scan: true
      auto_increment_revision: true
      publish: true

  build-carry:
    name: Build and publish Headroom MCP image (Cline Bedrock carry)
    needs: [detect-version-change, build-base]
    if: |
      always() &&
      (needs.detect-version-change.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: headroom-mcp
      context: ./images/headroom-mcp
      # Downstream carry: build-time patch for Cline OpenAI-compatible
      # traffic to Bedrock. When version changes, base Dockerfile builds first.
      # For manual dispatch, user can choose which Dockerfile to build.
      dockerfile: ./images/headroom-mcp/${{ inputs.dockerfile || 'Dockerfile.cline-bedrock' }}
      config: images/headroom-mcp/image.yaml
      version_arg: HEADROOM_VERSION
      platforms: linux/amd64
      smoke_command: __smoke
      smoke_timeout: 120
      scan: true
      auto_increment_revision: false
      publish: true
