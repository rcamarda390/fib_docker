name: Build and publish Headroom MCP image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['images/headroom-mcp/**']
  

permissions:
  contents: write
  packages: write
  # The shared workflow proposes the revision bump as a PR, because
  # the base branch rejects direct pushes. A reusable workflow runs
  # with the calling job's token scope, so the grant must be here.
  pull-requests: write

jobs:
  build:
    name: Build and publish Headroom MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: headroom-mcp
      context: ./images/headroom-mcp
      dockerfile: ./images/headroom-mcp/Dockerfile
      config: images/headroom-mcp/image.yaml
      version_arg: HEADROOM_VERSION
      platforms: linux/amd64
      smoke_command: __smoke
      # The proxy takes ~8s to boot and then loads the Kompress ONNX model on
      # the first /v1/compress request, which does not fit the 15s default.
      # This is a ceiling, not a wait: a fast image exits as soon as the smoke
      # test passes, so a generous budget costs nothing on a healthy run. It is
      # set deliberately high to stop guessing at the model-load cost; the job's
      # own `timeout-minutes: 30` still bounds the run. Reduce it once a green
      # run establishes what the first compression actually costs.
      smoke_timeout: 600
      scan: true
      auto_increment_revision: true
      publish: true
