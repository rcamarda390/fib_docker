name: Build, smoke-test, and publish the configured MCP image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      config:
        required: true
        type: string
      version_arg:
        required: true
        type: string
      platforms:
        required: false
        default: linux/amd64,linux/arm64
        type: string
      smoke_command:
        required: true
        type: string
      smoke_env:
        required: false
        default: ""
        type: string
      publish:
        required: false
        default: true
        type: boolean
      publish_ghcr:
        required: false
        default: true
        type: boolean
      publish_dockerhub:
        required: false
        default: true
        type: boolean
      scan:
        required: false
        default: false
        type: boolean
    outputs:
      image_tag:
        description: Versioned image tag
        value: ${{ jobs.build.outputs.image_tag }}
      ghcr_image:
        description: GHCR image reference
        value: ${{ jobs.build.outputs.ghcr_image }}
      dockerhub_image:
        description: Docker Hub image reference
        value: ${{ jobs.build.outputs.dockerhub_image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, smoke-test, and publish the configured MCP image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
      dockerhub_image: ${{ steps.meta.outputs.dockerhub_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image metadata
        id: meta
        env:
          CONFIG: ${{ inputs.config }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_ARG: ${{ inputs.version_arg }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_GHCR: ${{ inputs.publish_ghcr }}
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
        shell: bash
        run: |
          set -euo pipefail
          ruby - "$CONFIG" "$INPUT_IMAGE_NAME" "$VERSION_ARG" "$DOCKERHUB_USERNAME" <<'RUBY' >> "$GITHUB_OUTPUT"
          require "yaml"
          config = YAML.safe_load(File.read(ARGV[0]), permitted_classes: [], aliases: false)
          name = config.fetch("name")
          abort "image name does not match caller input" unless name == ARGV[1]
          abort "image name must be lowercase" unless name == name.downcase && name.match?(/\A[a-z0-9][a-z0-9.-]*\z/)
          version = config.fetch("upstream_version").to_s
          revision = config.fetch("revision").to_s
          abort "revision must be an integer" unless revision.match?(/\A[0-9]+\z/)
          publish = config.fetch("publish")
          abort "latest must be false for MCP images" if publish.fetch("latest", false)
          publish_ghcr = ENV.fetch("PUBLISH_GHCR") == "true"
          publish_dockerhub = ENV.fetch("PUBLISH_DOCKERHUB") == "true"
          abort "GHCR publication is not enabled" if publish_ghcr && !publish.fetch("ghcr", false)
          abort "Docker Hub publication is not enabled" if publish_dockerhub && !publish.fetch("dockerhub", false)
          dockerhub = ARGV[3]
          abort "DOCKERHUB_USERNAME is not configured" if dockerhub.empty? && ENV.fetch("PUBLISH") == "true" && publish_dockerhub
          dockerhub = "validation" if dockerhub.empty?
          puts "image_tag=#{version}-v#{revision}"
          puts "ghcr_image=ghcr.io/#{ENV.fetch("GITHUB_REPOSITORY_OWNER").downcase}/#{name}:#{version}-v#{revision}"
          puts "dockerhub_image=docker.io/#{dockerhub}/#{name}:#{version}-v#{revision}"
          puts "upstream_version=#{version}"
          puts "build_args<<BUILD_ARGS"
          (config["build_args"] || {}).each do |key, value|
            abort "build_args values must be strings" unless value.is_a?(String)
            puts "#{key}=#{value}"
          end
          puts "BUILD_ARGS"
          puts "publish_tags<<PUBLISH_TAGS"
          puts "ghcr.io/#{ENV.fetch("GITHUB_REPOSITORY_OWNER").downcase}/#{name}:#{version}-v#{revision}" if publish_ghcr
          puts "docker.io/#{dockerhub}/#{name}:#{version}-v#{revision}" if publish_dockerhub
          puts "PUBLISH_TAGS"
          RUBY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          build-args: |
            ${{ inputs.version_arg }}=${{ steps.meta.outputs.upstream_version }}
            ${{ steps.meta.outputs.build_args }}
          tags: mcp-smoke:${{ github.run_id }}

      - name: Run smoke test
        env:
          IMAGE: mcp-smoke:${{ github.run_id }}
          SMOKE_ENV: ${{ inputs.smoke_env }}
          SMOKE_COMMAND: ${{ inputs.smoke_command }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a SMOKE_ARGS <<< "$SMOKE_COMMAND"
          docker run --rm $SMOKE_ENV "$IMAGE" "${SMOKE_ARGS[@]}"

      - name: Scan candidate image with Trivy
        if: inputs.scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-smoke:${{ github.run_id }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Log in to GHCR
        if: inputs.publish && inputs.publish_ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.publish && inputs.publish_dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push selected registry tags
        if: inputs.publish && (inputs.publish_ghcr || inputs.publish_dockerhub)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          build-args: |
            ${{ inputs.version_arg }}=${{ steps.meta.outputs.upstream_version }}
            ${{ steps.meta.outputs.build_args }}
          tags: |
            ${{ steps.meta.outputs.publish_tags }}

      - name: Summary
        run: |
          {
            if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.publish_ghcr }}" = "true" -o "${{ inputs.publish_dockerhub }}" = "true" ]; then
              echo "## MCP image published to selected registries"
            else
              echo "## MCP image candidate validated"
            fi
            echo "- Tag: \`${{ steps.meta.outputs.image_tag }}\`"
            echo "- GHCR: \`${{ steps.meta.outputs.ghcr_image }}\`"
            echo "- Docker Hub: \`${{ steps.meta.outputs.dockerhub_image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
