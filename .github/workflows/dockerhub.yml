name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rcamarda390/fib_docker:candidate-${{ github.run_id }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rcamarda390/fib_docker:candidate-${{ github.run_id }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Trivy scan and fail on vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rcamarda390/fib_docker:candidate-${{ github.run_id }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Publish image
        if: always()
        run: |
          set -euo pipefail
          docker tag "rcamarda390/fib_docker:candidate-${GITHUB_RUN_ID}" rcamarda390/fib_docker:latest
          docker tag "rcamarda390/fib_docker:candidate-${GITHUB_RUN_ID}" "rcamarda390/fib_docker:v-${GITHUB_RUN_NUMBER}"
          docker push rcamarda390/fib_docker:latest
          docker push "rcamarda390/fib_docker:v-${GITHUB_RUN_NUMBER}"

  docker-scout:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout - CVE Report
        uses: docker/scout-action@v1
        with:
          command: cves
          image: rcamarda390/fib_docker:latest
          only-severities: critical,high
          exit-code: true
          write-comment: true

      - name: Docker Scout - Image Policy Check
        uses: docker/scout-action@v1
        with:
          command: compare
          image: rcamarda390/fib_docker:latest
          to: 'registry://rcamarda390/fib_docker:latest'
          write-comment: true
