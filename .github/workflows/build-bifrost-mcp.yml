name: Build and publish Bifrost MCP image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # The shared workflow proposes the revision bump as a PR, because
  # the base branch rejects direct pushes. A reusable workflow runs
  # with the calling job's token scope, so the grant must be here.
  pull-requests: write

jobs:
  build:
    name: Build and publish Bifrost MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: bifrost-mcp
      context: ./images/bifrost-mcp
      dockerfile: ./images/bifrost-mcp/Dockerfile
      config: images/bifrost-mcp/image.yaml
      version_arg: BIFROST_VERSION
      # The Dockerfile clones this exact upstream commit and verifies the tag.
      platforms: linux/amd64
      run_smoke_test: false
      smoke_healthcheck: true
      scan: true
      # Use the run number to mint a fresh immutable revision in this same
      # build/publish action; no follow-up revision PR or second build is needed.
      revision_from_run_number: true
      publish: ${{ github.event_name != 'pull_request' }}
