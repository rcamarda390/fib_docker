name: build-gnosis-mcp

on:
  push:
    branches: [main]
    paths:
      - images/gnosis-mcp/**
      - .github/workflows/build-gnosis-mcp.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - images/gnosis-mcp/**
      - .github/workflows/build-gnosis-mcp.yml
      - .github/workflows/build-image.yml
  schedule:
    - cron: "51 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image_name: gnosis-mcp
      context: ./images/gnosis-mcp
      dockerfile: ./images/gnosis-mcp/Dockerfile
      config: images/gnosis-mcp/image.yaml
      version_arg: GNOSIS_VERSION
      platforms: linux/amd64
      smoke_env: -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1
      smoke_command: check
      scan: true
      publish: ${{ github.event_name != 'pull_request' }}
