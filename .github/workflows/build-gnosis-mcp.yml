name: Build gnosis-mcp air-gap image

on:
  workflow_dispatch:
    inputs:
      gnosis_version:
        description: "gnosis-mcp PyPI version"
        required: true
        default: "0.13.3-v2"
      embed_model:
        description: "HuggingFace model to pre-bundle"
        required: true
        default: "MongoDB/mdbr-leaf-ir"
      image_tag:
        description: "Docker image tag"
        required: true
        default: "0.13.3-airgap"

  push:
    paths:
      - "images/gnosis-mcp/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build args
        id: args
        run: |
          echo "tag=${{ github.event.inputs.image_tag || '0.13.3-airgap' }}"         >> $GITHUB_OUTPUT
          echo "version=${{ github.event.inputs.gnosis_version || '0.13.3' }}"       >> $GITHUB_OUTPUT
          echo "model=${{ github.event.inputs.embed_model || 'MongoDB/mdbr-leaf-ir' }}" >> $GITHUB_OUTPUT
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/gnosis-mcp:${{ github.event.inputs.image_tag || '0.13.3-airgap' }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/gnosis-mcp
          file: images/gnosis-mcp/Dockerfile
          push: true
          tags: |
            ${{ steps.args.outputs.image }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gnosis-mcp:latest-airgap
          build-args: |
            GNOSIS_VERSION=${{ steps.args.outputs.version }}
            EMBED_MODEL=${{ steps.args.outputs.model }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test
        run: |
          docker pull ${{ steps.args.outputs.image }}
          docker run --rm \
            -e HF_HUB_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            ${{ steps.args.outputs.image }} \
            check
          echo "Smoke test passed"

      - name: Summary
        run: |
          echo "## Build complete" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.args.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**gnosis-mcp:** \`${{ steps.args.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** \`${{ steps.args.outputs.model }}\`" >> $GITHUB_STEP_SUMMARY
