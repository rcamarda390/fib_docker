name: build-gnosis-mcp

on:
  push:
    branches: [main]
    paths:
      - images/gnosis-mcp/**
      - .github/workflows/build-gnosis-mcp.yml
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: gnosis-mcp
      context: ./images/gnosis-mcp
      dockerfile: ./images/gnosis-mcp/Dockerfile
      config: images/gnosis-mcp/image.yaml
      version_arg: GNOSIS_VERSION
      platforms: linux/amd64

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/gnosis-mcp:${{ needs.build.outputs.image_tag }}
        run: |
          docker pull "$IMAGE"
          docker run --rm \
            -e HF_HUB_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            "$IMAGE" check
