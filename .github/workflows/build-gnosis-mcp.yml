name: build-gnosis-mcp

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # The shared workflow proposes the revision bump as a PR, because
  # the base branch rejects direct pushes. A reusable workflow runs
  # with the calling job's token scope, so the grant must be here.
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: gnosis-mcp
      context: ./images/gnosis-mcp
      dockerfile: ./images/gnosis-mcp/Dockerfile
      config: images/gnosis-mcp/image.yaml
      version_arg: GNOSIS_VERSION
      platforms: linux/amd64
      smoke_env: -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1
      smoke_command: check
      scan: true
      block_on_scan_failure: true
      auto_increment_revision: true
      publish: ${{ github.event_name != 'pull_request' }}
