name: Build and publish Archify image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "images/archify/**"
      - ".github/workflows/build-archify.yml"

concurrency:
  group: archify-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and publish Archify image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: archify
      context: ./images/archify
      dockerfile: ./images/archify/Dockerfile
      config: images/archify/image.yaml
      version_arg: ARCHIFY_VERSION
      platforms: linux/amd64
      smoke_command: doctor
      smoke_timeout: 30
      scan: true
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
