name: Build and publish sooperset-mcp-atlassian image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and publish sooperset-mcp-atlassian image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
    with:
      image_name: sooperset-mcp-atlassian
      context: ./images/sooperset-mcp-atlassian
      dockerfile: ./images/sooperset-mcp-atlassian/Dockerfile
      config: images/sooperset-mcp-atlassian/image.yaml
      version_arg: VERSION
      platforms: linux/amd64
      smoke_command: --help
      scan: true
      auto_increment_revision: true
      publish: ${{ github.event_name != 'pull_request' }}
