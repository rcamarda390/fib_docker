name: headroom-mcp
upstream_version: 0.36.5
# 0 rather than 43: the first published build of a new upstream_version is
# always v1 (build-image.yml resets the revision when the version line
# changes, and 0 + 1 lands on the same number if that reset ever misses).
# Dockerfile.cline-bedrock pins its base image to the version line below, so
# the tag the base build produces has to be predictable, not merely sequential.
revision: 0
build_args:
  HEADROOM_COMMIT: 34a551756222b24ea4bc064f4250b8e7d169daf1
publish:
  ghcr: true
  dockerhub: true
  latest: false
