services:
  iii-data-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod 755 /data"]
    volumes:
      - iii-data:/data
    restart: "no"

  iii-engine:
    image: ${ARTIFACTORY_REGISTRY:-ghcr.io/rcamarda390}/iii-engine:0.22.0-airgap-v1
    depends_on:
      iii-data-init:
        condition: service_completed_successfully
    volumes:
      - iii-data:/data
    ports:
      - "3111:3111"
      - "3112:3112"
      - "49134:49134"
    healthcheck:
      test: ["CMD", "/busybox", "nc", "-z", "127.0.0.1", "49134"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  agentmemory:
    image: ${ARTIFACTORY_REGISTRY:-ghcr.io/rcamarda390}/agentmemory:0.9.26
    depends_on:
      iii-engine:
        condition: service_healthy
    environment:
      III_ENGINE_URL: ws://iii-engine:49134
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    volumes:
      - agentmemory-data:/data
    ports:
      - "3113:3113"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://iii-engine:3111/agentmemory/livez || true"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  iii-data:
  agentmemory-data:
