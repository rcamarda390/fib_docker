name: build-agentmemory-mcp-all

on:
  workflow_dispatch:
    inputs:
      build_iii_engine:
        description: Build iii-engine
        required: false
        default: true
        type: boolean
      build_agentmemory:
        description: Build agentmemory
        required: false
        default: true
        type: boolean
      agentmemory_version:
        description: agentmemory npm version to build
        required: false
        default: 0.9.26

permissions:
  contents: read
  packages: write

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          III_VERSION=$(grep -E '^ARG III_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d= -f2)
          III_IMAGE_VERSION=$(grep -E '^ARG III_IMAGE_VERSION=' images/agentmemory-mcp/Dockerfile.iii-engine | cut -d= -f2)
          echo "iii_version=${III_VERSION}" >> "$GITHUB_OUTPUT"
          echo "iii_image_version=${III_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "iii_image_tag=${III_VERSION}-airgap-${III_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build iii-engine
        if: inputs.build_iii_engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/agentmemory-mcp/Dockerfile.iii-engine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            III_VERSION=${{ steps.meta.outputs.iii_version }}
            III_IMAGE_VERSION=${{ steps.meta.outputs.iii_image_version }}
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }}

      - name: Smoke test iii-engine
        if: inputs.build_iii_engine
        run: |
          docker pull ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }}
          docker run --rm ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }} --version

      - name: Build agentmemory
        if: inputs.build_agentmemory
        uses: docker/build-push-action@v6
        with:
          context: ./images/agentmemory-mcp
          file: ./images/agentmemory-mcp/Dockerfile.agentmemory
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AGENTMEMORY_VERSION=${{ inputs.agentmemory_version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ inputs.agentmemory_version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:latest

      - name: Smoke test agentmemory
        if: inputs.build_agentmemory
        run: |
          docker pull ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ inputs.agentmemory_version }}
          docker run --rm \
            -e III_ENGINE_URL=ws://localhost:49134 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ inputs.agentmemory_version }} \
            node -e "console.log('agentmemory image OK')"

      - name: Report
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_iii_engine }}" = "true" ]; then
            echo "✅ iii-engine:${{ steps.meta.outputs.iii_image_tag }} → ghcr.io/${{ steps.meta.outputs.owner }}/iii-engine:${{ steps.meta.outputs.iii_image_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.build_agentmemory }}" = "true" ]; then
            echo "✅ agentmemory:${{ inputs.agentmemory_version }} → ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ inputs.agentmemory_version }}" >> $GITHUB_STEP_SUMMARY
          fi
